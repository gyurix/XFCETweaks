# XFCETweaks: keep dGPU VRAM across suspend/hibernate. Fine-grained D3cold runtime PM
# (0x02) is disabled: driver 615.71.09 + kernel 7.0 crashed on D3cold wake/unload and on
# client exit (nvidia_dev_put refcount WARN, GPU hang), 2026-10-16.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
options nvidia NVreg_DynamicPowerManagement=0x00
