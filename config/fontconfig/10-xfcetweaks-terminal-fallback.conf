<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- XFCETweaks: monospace fallback for opencode TUI spinners.
       Startup loading uses braille U+2800-U+28FF (no stock monospace font
       covers it); prompt scanner uses U+2B25/U+2B29/U+2B2A/U+2B1D which only
       Symbola provides. Append proportional fallbacks so Ghostty/VTE render
       tofu-free instead of boxes. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
      <family>Symbola</family>
      <family>Noto Sans Symbols2</family>
      <family>Noto Sans Symbols</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
</fontconfig>
